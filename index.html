<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>facebook-Log In or Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <div class="left">
            <h1>facebook</h1>

            <p>
                Connect with friends and the world
                around you.
            </p>
        </div>

        <div class="right">

            <div class="login-box">

                

                <form id="loginForm">

                    <input
                        type="text"
                        placeholder="Email or Phone Number"
                        required
                    >

                    <input
                        type="password"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Log In
                    </button>

                </form>
                <div id="result" aria-live="polite"></div>

                <a href="#" id="forgotLink">
                    Forgot Password?
                </a>

                <hr>

                <button class="create-account" type="button">
                    Create New Account
                </button>

            </div>

            <p class="disclaimer">
                EDUCATIONAL PURPOSE ONLY.
                NEVER ENTER REAL PASSWORDS.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
